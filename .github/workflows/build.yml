name: Build

on:
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'linux/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: linux/Pauth40/Pauth40.csproj

jobs:
  windows:
    name: Windows (WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ${{ env.PROJECT }} -f net10.0-windows10.0.26100 -c Release -p:TargetFrameworks=net10.0-windows10.0.26100

  linux:
    name: Linux (Skia) and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Build Linux desktop
        run: dotnet build ${{ env.PROJECT }} -f net10.0-desktop -c Release -p:TargetFrameworks=net10.0-desktop
      - name: Build WebAssembly
        run: dotnet build ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:TargetFrameworks=net10.0-browserwasm

  macos:
    name: macOS / iOS / tvOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Apple workloads
        run: dotnet workload install ios tvos
      - name: Build macOS desktop
        run: dotnet build ${{ env.PROJECT }} -f net10.0-desktop -c Release -p:TargetFrameworks=net10.0-desktop
      - name: Build iOS simulator
        run: dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-x64
      - name: Build tvOS simulator
        run: dotnet build ${{ env.PROJECT }} -f net10.0-tvos -c Release -p:TargetFrameworks=net10.0-tvos -p:RuntimeIdentifier=tvossimulator-x64

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build
        run: dotnet build ${{ env.PROJECT }} -f net10.0-android -c Release -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk
