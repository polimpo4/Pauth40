name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2.2.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: linux/Pauth40/Pauth40.csproj

jobs:
  windows:
    name: Windows artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish win-x64
        shell: pwsh
        run: |
          $version = ([xml](Get-Content $env:PROJECT)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          dotnet publish $env:PROJECT -f net10.0-windows10.0.26100 -c Release -p:TargetFrameworks=net10.0-windows10.0.26100 -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:WindowsPackageType=None `
            -p:UseMonoRuntime=false -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
          Copy-Item publish/Pauth40.exe "Pauth40-$version-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Pauth40-*-win-x64.exe

  linux:
    name: Linux and WebAssembly artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish linux-x64
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT" | head -n1)"
          dotnet publish "$PROJECT" -f net10.0-desktop -c Release -p:TargetFrameworks=net10.0-desktop -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true -p:UseMonoRuntime=false \
            -p:DebugType=none -o publish
          cp linux/Pauth40.desktop linux/install-linux.sh linux/uninstall-linux.sh publish/
          cp publish/Assets/app_mark.png publish/pauth40.png
          chmod +x publish/Pauth40 publish/install-linux.sh publish/uninstall-linux.sh
          tar -C publish -czf "Pauth40-$VERSION-linux-x64.tar.gz" .
      - name: Publish WebAssembly
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT" | head -n1)"
          dotnet publish "$PROJECT" -f net10.0-browserwasm -c Release -p:TargetFrameworks=net10.0-browserwasm -o wasm
          (cd wasm/wwwroot && zip -qr "../../Pauth40-$VERSION-wasm.zip" .)
      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT" | head -n1)"
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          APPDIR=Pauth40.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -R publish/. "$APPDIR/usr/bin/"
          rm -f "$APPDIR/usr/bin/install-linux.sh" "$APPDIR/usr/bin/uninstall-linux.sh"
          cp publish/pauth40.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/pauth40.png"
          cp publish/pauth40.png "$APPDIR/pauth40.png"
          cp linux/Pauth40.desktop "$APPDIR/pauth40.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/Pauth40" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "Pauth40-$VERSION-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Pauth40-*-linux-x64.tar.gz
            Pauth40-*-x86_64.AppImage
            Pauth40-*-wasm.zip

  macos:
    name: macOS artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish osx-arm64 and osx-x64
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT" | head -n1)"
          for RID in osx-arm64 osx-x64; do
            dotnet publish "$PROJECT" -f net10.0-desktop -c Release -p:TargetFrameworks=net10.0-desktop -r "$RID" \
              --self-contained true -p:PublishSingleFile=true -p:UseMonoRuntime=false \
              -p:DebugType=none -o "publish-$RID"

            APP="Pauth40.app"
            rm -rf "$APP"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp -R "publish-$RID/." "$APP/Contents/MacOS/"

            cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pauth40</string>
            <key>CFBundleDisplayName</key><string>Pauth40</string>
            <key>CFBundleIdentifier</key><string>com.pauth40.authenticator</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>Pauth40</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

            ditto -c -k --sequesterRsrc --keepParent "$APP" "Pauth40-$VERSION-$RID.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Pauth40-*-osx-*.zip

  release:
    name: Publish GitHub release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" release-notes.md
          else
            printf 'Pauth40 %s\n' "$TAG" > release-notes.md
          fi
          ls -lh release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Pauth40 ${{ github.event.inputs.tag }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
